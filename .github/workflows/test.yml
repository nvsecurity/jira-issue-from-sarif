name: Test

# Runs the same tests/run.sh that developers run locally, so local and CI can
# never check different things. The suite is standard-library only (FakeJira,
# no network, no credentials), so no dependency install is needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run test entrypoint
        run: ./tests/run.sh
